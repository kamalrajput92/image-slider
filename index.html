
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Image Slider</h1>
        <p>Explore the beauty of nature</p>

        <div class="slider">
            <div class="slides">

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Beautiful nature">
                    <div class="caption">Beautiful Nature</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Mountain lake">
                    <div class="caption">Mountain Escape</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=80" alt="Sunrise">
                    <div class="caption">Golden Sunrise</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="Green forest">
                    <div class="caption">Green Forest</div>
                </div>

            </div>

            <button class="prev" aria-label="Previous image">&#10094;</button>
            <button class="next" aria-label="Next image">&#10095;</button>

            <div class="dots"></div>
        </div>

        <p class="footer">Made with HTML, CSS & JavaScript</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
